# LARE default configuration
# These are the paper's reported settings (Section 4 and ablation in Appendix A.1)

model: siglip  # Options: clip, clip-large, clip-336, siglip, siglip-so400m, siglip2

detector:
  kernel_size: 64     # Sliding window size in attention map pixels
  stride: 32          # Sliding window stride
  n_regions: 5        # Number of low-attention regions to extract (N in the paper)
  iou_threshold: 0.3  # IoU threshold for NMS region deduplication
  min_crop_size: 32   # Minimum crop side length in pixels

scoring:
  tau: 0.25           # Confidence threshold (paper Eq. 4); below this, regions are used
